services:
  # --- Spring Boot Application ---
  app:
    build: .
    # Ports are exposed only to Nginx, not directly to host
    # ports:
    #   - "8080:8080"
    environment:
      # Override local settings for Docker environment
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/flashform
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
      - rabbitmq

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"  # Public HTTP port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount static resources directly to Nginx for performance
      - ./src/main/resources/static:/usr/share/nginx/html:ro
    depends_on:
      - app

  # --- Infrastructure Services ---
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: flashform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI

volumes:
  postgres_data: