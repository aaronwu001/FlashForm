services:
  app:
    build: .
    # ✨ 修改點 1: 把這裡註解掉！
    # 我們不希望從外部直接訪問 Spring Boot，必須通過 Nginx
    # ports:
    #   - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/flashform
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
      - rabbitmq

  # ✨ 修改點 2: 新增 Nginx 服務
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"  # 對外開放標準 HTTP Port (瀏覽器不用打 :8080 了)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # 掛載剛剛寫好的設定檔
      - ./src/main/resources/static:/usr/share/nginx/html:ro # ✨ 關鍵：動靜分離，Nginx 直接讀這個資料夾
    depends_on:
      - app

  # --- 以下資料庫與中間件保持不變 ---
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: flashform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data: